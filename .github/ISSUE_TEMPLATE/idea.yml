name: Suggest an idea
description: Something Freighter could do, or do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Freighter to do, and what would it help with?
    validations:
      required: true
  - type: input
    id: daw
    attributes:
      label: Which DAW do you use?
      description: For example FL Studio 2025 or Ableton Live 12.
