# Runs Freighter's tests on real Windows and Mac machines (free on GitHub) for every change.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.8", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and full-move tests
        run: python -m unittest discover -s tests -v
      - name: Scanner runs on a real machine
        run: python manifest.py --no-open --quick --out scan-output
      - name: Mover lists what it would pack
        run: python freighter.py pack --list
      - name: Mover's scan runs (plugin report plus project list)
        run: python freighter.py scan --no-open --quick --out scan-cli
      - name: Sorter previews a folder
        run: python crate.py preview tests --no-open --out crate-output
      - name: Keep the scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.os }}-py${{ matrix.python }}
          path: scan-output

  # Builds double-click programs (no Python needed) once the tests pass.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.11.1
      - name: Name this build (shown in the app, and used by "Check for updates")
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then b="$GITHUB_REF_NAME"; else b="$GITHUB_REF_NAME@${GITHUB_SHA::7}"; fi
          printf 'BUILD = "%s"\n' "$b" > freighter_build.py
          cat freighter_build.py
      - name: Build freighter and manifest
        run: |
          pyinstaller --onefile --name freighter freighter.py
          pyinstaller --onefile --name manifest manifest.py
          pyinstaller --onefile --name crate crate.py
      - name: The built programs run
        shell: bash
        run: |
          v=$(python -c 'import freighter_version as v; print(v.__version__)' | tr -d '\r')
          for t in freighter manifest crate; do ./dist/$t --version | tr -d '\r' | grep -q " $v$"; done
          ./dist/freighter pack --list
          ./dist/manifest --no-open --quick --out smoke-scan
          ./dist/crate preview tests --no-open --out smoke-crate
          printf 'q\n' | ./dist/freighter
      - name: Add the Windows test guide, license and changelog
        shell: bash
        run: cp WINDOWS-TEST.md LICENSE CHANGELOG.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: freighter-${{ matrix.name }}
          path: dist/
      # The download people get from a Release. Zipped here, because GitHub's own artifact zips drop the Mac
      # programs' "executable" permission and they wouldn't start. The Mac zip holds one folder (Archive Utility
      # unzips it as is); the Windows zip holds the files themselves, because Extract All already makes a folder.
      - name: Package the download (Mac)
        if: matrix.name == 'mac'
        run: |
          mkdir -p pkg && cp -R dist pkg/freighter-mac
          cd pkg && zip -r -X -q ../freighter-mac.zip freighter-mac
      - name: Package the download (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item -Recurse dist pkg/freighter-windows
          Compress-Archive -Path pkg/freighter-windows/* -DestinationPath freighter-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: freighter-${{ matrix.name }}.zip

  # Pushing a version tag (v0.9.0, or v0.9.0-test.1 for a test build) publishes both downloads as a GitHub
  # Release, with download steps and that version's changelog as the notes (issue #36). A tag with a "-" in it
  # is marked as a pre-release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/release_notes.py "$GITHUB_REF_NAME" > notes.md
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" freighter-windows.zip freighter-mac.zip $pre \
            --title "Freighter ${GITHUB_REF_NAME#v}" --notes-file notes.md
